<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOX Video Studio</title><link rel="stylesheet" href="/style.css"></head><body>
<main><header><span class="pill">HYBRID VIDEO PIPELINE</span><h1>VOX Video Studio</h1><p>Từ một chủ đề thành storyboard, cảnh quay, phụ đề và MP4.</p></header>
<section id="config" class="config"></section>
<section class="card"><form id="form"><label>Chủ đề<input id="topic" required minlength="3" placeholder="Ví dụ: Vì sao Nhật Bản có nhiều máy bán hàng tự động?"></label>
<label>Script có sẵn (không bắt buộc)<textarea id="script" rows="6" placeholder="Để trống để AI tự viết..."></textarea></label>
<div class="grid"><label>Thời lượng<select id="duration"><option value="30">30 giây</option><option value="45" selected>45 giây</option><option value="60">60 giây</option><option value="180">3 phút</option></select></label>
<label>Tỉ lệ<select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></label></div>
<button>Tạo video</button></form></section><section id="result" class="card hidden"></section>
<section><h2>Dự án gần đây</h2><div id="projects"></div></section></main><script src="/app.js"></script></body></html>
