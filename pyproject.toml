[project]
name = "vox-video-tool"
version = "0.1.0"
description = "Hybrid VOX-style video pipeline"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.6", "httpx>=0.27", "python-multipart>=0.0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

